# ─────────────────────────────────────────────────────────────────────────────
# oyuns.mn → redirect to canonical www
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name oyuns.mn;

    # ACME HTTP-01 challenge (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.oyuns.mn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oyuns.mn;

    ssl_certificate     /etc/letsencrypt/live/oyuns.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oyuns.mn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.oyuns.mn$request_uri;
}

# ─────────────────────────────────────────────────────────────────────────────
# www.oyuns.mn → website (Next.js container: oyuns-website-1:3000)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.oyuns.mn;

    # ACME HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.oyuns.mn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.oyuns.mn;

    ssl_certificate     /etc/letsencrypt/live/oyuns.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oyuns.mn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static Next.js assets — long cache, served by proxy
    location /_next/static/ {
        proxy_pass         http://oyuns-website-1:3000;
        proxy_cache_valid  200 365d;
        add_header Cache-Control "public, immutable";
        access_log         off;
    }

    # Everything else → Next.js
    location / {
        proxy_pass             http://oyuns-website-1:3000;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection 'upgrade';
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_cache_bypass     $http_upgrade;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;
    }
}
